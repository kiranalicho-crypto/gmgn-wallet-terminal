name: Moralis Daily XY Scan 2026

on:
  workflow_dispatch:
    inputs:
      max_api_calls:
        description: "Daily call budget. Keep 760 for 38,000 CU."
        required: true
        default: "760"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Restore state from latest successful artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACTS_JSON="$(
            curl --fail --silent --show-error \
              --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=moralis-daily-xy-scan-2026&per_page=100"
          )"
          ARTIFACT_ID="$(
            jq -r '
              [
                .artifacts[]
                | select(.expired == false)
              ]
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ' <<<"${ARTIFACTS_JSON}"
          )"
          test -n "${ARTIFACT_ID}"
          echo "Restoring artifact id: ${ARTIFACT_ID}"

          mkdir -p /tmp/moralis-previous
          curl --fail --silent --show-error \
            --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/moralis-previous.zip
          unzip -q /tmp/moralis-previous.zip -d /tmp/moralis-previous

          STATE_SOURCE="$(
            find /tmp/moralis-previous \
              -type f \
              -name moralis_state_updated.zip \
              -print \
              -quit
          )"
          test -n "${STATE_SOURCE}"
          cp "${STATE_SOURCE}" data/moralis_state_current.zip

          ACTUAL_SHA256="$(sha256sum data/moralis_state_current.zip | awk '{print $1}')"
          echo "Restored state SHA256: ${ACTUAL_SHA256}"
          python - <<'PY'
          import zipfile
          path = "data/moralis_state_current.zip"
          with zipfile.ZipFile(path) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"Corrupt state member: {bad}")
              names = set(archive.namelist())
              required = {"progress.json", "xy_scan_meta.json"}
              missing = required - names
              if missing:
                  raise SystemExit(
                      f"State is missing required files: {sorted(missing)}"
                  )
              print(
                  f"State rebuilt successfully: "
                  f"{len(archive.infolist())} files"
              )
          PY

      - name: Validate package
        run: |
          set -euo pipefail
          test -f scripts/moralis_daily_xy_scan.py
          test -f data/moralis_state_current.zip
          test -f data/x_chain_strict_pass_2026.csv
          VERSION="$(python scripts/moralis_daily_xy_scan.py --version)"
          echo "$VERSION"
          test "$VERSION" = "2026-07-25-moralis-daily-xy-scan-v4-25k-resume"

      - name: Run daily Moralis scan
        env:
          MORALIS_API_KEY: ${{ secrets.MORALIS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${MORALIS_API_KEY:-}"
          python -u scripts/moralis_daily_xy_scan.py \
            --max-api-calls "${{ inputs.max_api_calls }}" \
            --request-interval-seconds 0.20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moralis-daily-xy-scan-2026
          path: output-moralis-daily-xy-scan/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Print final report
        if: always()
        run: |
          if [ -f output-moralis-daily-xy-scan/run_report.json ]; then
            cat output-moralis-daily-xy-scan/run_report.json
          fi
